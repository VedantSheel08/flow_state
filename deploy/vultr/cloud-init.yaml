#cloud-config
# Vultr "User Data" for a fresh Ubuntu instance. Contains NO secrets (Vultr stores user data): copy .env over SSH afterwards (see README).
package_update: true
packages: [ca-certificates, curl, git, ufw]
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - sh -c '. /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - ufw default deny incoming && ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
  - git clone --branch REPLACE_WITH_BRANCH REPLACE_WITH_REPO_URL /opt/flowstate
