# Render Blueprint for the FlowState API (free web service). Apply from the dashboard: New > Blueprint.
# The Dockerfile is at the repo root, so the build is the same whether the service comes from this file
# or was configured by hand. See docs/RENDER.md.
services:
  - type: web
    name: flowstate
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: false            # deploy manually: a redeploy restarts any live run
    plan: free                   # 512 MB RAM, 0.1 CPU, no persistent disk, sleeps after 15 min idle
    region: oregon
    numInstances: 1              # the live run is in process memory: never scale out
    healthCheckPath: /api/health
    envVars:
      - key: FLOWSTATE_BACKEND
        value: traci
      - key: PYTHONUNBUFFERED
        value: "1"
